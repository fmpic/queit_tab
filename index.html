<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="description" content="一个轻盈的新标签页。搜索、常用网站，然后开始探索。">
  <meta name="referrer" content="no-referrer">
  <title>栖页 · 新标签页</title>
  <link rel="icon" href="./favicon.svg" type="image/svg+xml">

<body>

    <div class="intro">
      <h1 class="site-brand"><svg viewBox="0 0 32 32" width="48" height="48" aria-hidden="true"><path d="M16 3 29 16 16 29 3 16Z" fill="currentColor" opacity=".13"/><path d="M16 7 25 16 16 25 7 16Z" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M12 16h8M16 12v8" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg><span>栖页</span></h1>
      <p id="daily-quote" class="daily-quote">愿你今天，也有新的发现。</p>
      <p class="subtitle" id="quote-source">每日一言</p>
    </div>
    <section class="search-section" aria-label="网页搜索">
      <form id="search-form" action="https://www.google.com/search" method="get" role="search">
        <div class="engine-control">
          <button class="engine-button" id="engine-toggle" type="button" aria-label="选择搜索引擎，当前 Google" aria-haspopup="menu" aria-expanded="false" aria-controls="engine-menu"><span class="engine-mark" data-engine="google" id="engine-mark" aria-hidden="true">G</span><svg viewBox="0 0 16 16" width="13" height="13" aria-hidden="true"><path d="m4 6 4 4 4-4" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
          <div class="engine-menu" id="engine-menu" role="menu" hidden>
            <button type="button" role="menuitemradio" aria-checked="true" data-engine="google"><span class="engine-mark" data-engine="google">G</span>Google<span class="menu-command">!g</span></button>
            <button type="button" role="menuitemradio" aria-checked="false" data-engine="bing"><span class="engine-mark" data-engine="bing">b</span>Bing<span class="menu-command">!b</span></button>
            <button type="button" role="menuitemradio" aria-checked="false" data-engine="duckduckgo"><span class="engine-mark" data-engine="duckduckgo">D</span>DuckDuckGo<span class="menu-command">!d</span></button>
            <button type="button" role="menuitemradio" aria-checked="false" data-engine="baidu"><span class="engine-mark" data-engine="baidu">度</span>百度<span class="menu-command">!bd</span></button>
          </div>
        </div>
        <label class="visually-hidden" for="query">搜索内容</label>
        <input id="query" name="q" type="search" placeholder="用 Google 搜索" autocomplete="off" autocapitalize="off" spellcheck="false" enterkeyhint="search" required>
        <button class="submit-button" type="submit" aria-label="搜索"><svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M5 12h14m-6-6 6 6-6 6" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
      </form>
    </section>
